name: Tests

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: [ "3.13" ]

    env:
      ENV: test

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt -r requirements-test.txt

    - name: Run tests with coverage
      run: |
        python -m coverage run -m unittest discover -s tests -p "test_*.py" -v
        python -m coverage report -m > coverage.txt

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-artifacts
        path: coverage.txt

  publish-badge:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt -r requirements-test.txt

    - name: Download coverage artifacts
      uses: actions/download-artifact@v4
      with:
        name: coverage-artifacts
        path: .

    - name: Generate coverage badge json
      run: python scripts/coverage_generator.py

    - name: Commit updated coverage badge
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "chore(ci): update coverage badge [skip ci]"
        file_pattern: resources/badges/coverage.json